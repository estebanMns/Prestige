version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Next.js lee las variables del servidor desde .env.production durante el build.
        # Las variables se toman del entorno de Amplify (Configuración de la aplicación → Variables de entorno).
        - echo "DATABASE_URL=${DATABASE_URL}" > .env.production
        - echo "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" >> .env.production
        # DATABASE_SSL_CA debe guardarse en Amplify en una sola línea, con los saltos de línea escritos como \n.
        - echo "DATABASE_SSL_CA=\"${DATABASE_SSL_CA}\"" >> .env.production
        - echo "APP_URL=${APP_URL}" >> .env.production
        - echo "STORAGE_DRIVER=${STORAGE_DRIVER}" >> .env.production
        - echo "S3_BUCKET=${S3_BUCKET}" >> .env.production
        - echo "S3_REGION=${S3_REGION}" >> .env.production
        - echo "S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}" >> .env.production
        - echo "NEXT_PUBLIC_IMAGE_HOST=${NEXT_PUBLIC_IMAGE_HOST}" >> .env.production
        - echo "NEXT_PUBLIC_UPLOAD_HOST=${NEXT_PUBLIC_UPLOAD_HOST}" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
