# Base de datos para desarrollo local:  docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prestige
      POSTGRES_PASSWORD: prestige
      POSTGRES_DB: prestige
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prestige-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestige"]
      interval: 5s
      retries: 10

volumes:
  prestige-db:
